name: Build Disco Sauce Splitt (Windows VST3)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: DiscoSauceSplitt-Windows
          path: |
            build/DiscoSauceSplitt_artefacts/Release/VST3
            build/DiscoSauceSplitt_artefacts/Release/Standalone
