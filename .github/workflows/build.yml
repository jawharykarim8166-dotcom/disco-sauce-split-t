name: Build Disco Sauce Splitt (Windows VST3)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: List files
        shell: pwsh
        run: |
          cmake --version 2>&1 | Tee-Object -FilePath tree.txt
          Get-ChildItem -Recurse -Force -Name | Where-Object { $_ -notlike '.git\*' } | Tee-Object -FilePath tree.txt -Append

      - name: Simplify CMake file
        shell: pwsh
        run: |
          (Get-Content CMakeLists.txt) -replace 'VST3_CATEGORIES Fx Tools','' | Set-Content CMakeLists.txt

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 2>&1 | Tee-Object -FilePath configure-log.txt

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-log.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            tree.txt
            configure-log.txt
            build-log.txt
          if-no-files-found: ignore

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: DiscoSauceSplitt-Windows
          path: |
            build/DiscoSauceSplitt_artefacts/Release/VST3
            build/DiscoSauceSplitt_artefacts/Release/Standalone
